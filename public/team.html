<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Team · Bluebee</title>
  <style>html.auth-pending body{visibility:hidden}</style>
  <script src="/assets/auth-guard.js"></script>
  <link rel="stylesheet" href="/assets/app.css">
  <link rel="stylesheet" href="/assets/admin.css">
</head>
<body class="dashboard-body">
  <div class="app-frame">
    <!-- Sidebar: the menu and user box are filled in by shell.js for your role -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <a href="/"><span><strong>Bluebee</strong></span></a>
        <button type="button" class="sidebar-close" id="sidebarClose" aria-label="Close navigation">×</button>
      </div>
      <nav class="sidebar-nav"></nav>
      <div class="sidebar-user"></div>
    </aside>
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <div class="main-column">
      <button type="button" class="menu-toggle floating-menu" id="menuToggle" aria-label="Open navigation">☰</button>
      <main class="content-shell">
        <section class="page-head">
          <div>
            <h1>Team</h1>
            <p id="teamSubtitle">Add members and choose which X accounts each editor can post from.</p>
          </div>
        </section>
        <div class="split-layout">
          <section class="panel form-card">
            <div class="section-head"><div><span class="eyebrow">Team access</span><h2>Add member</h2></div></div>
            <form class="stack" id="memberForm">
              <label>Name<input name="name" required maxlength="80"></label>
              <label>Email<input type="email" name="email" required></label>
              <label>Role
                <select name="role" id="memberRole">
                  <option value="editor">Editor</option>
                  <option value="viewer">Viewer</option>
                </select>
                <small>Editors post with their assigned accounts. Viewers are read-only.</small>
              </label>
              <fieldset class="account-access" id="memberAccessBox">
                <legend>X account access</legend>
                <p>Pick every account this editor can choose in the Composer dropdown.</p>
                <div class="check-list" id="memberAccounts"></div>
              </fieldset>
              <label>Password<input type="password" name="password" minlength="10" autocomplete="new-password" required><small>At least 10 characters. Share it securely.</small></label>
              <label>Confirm password<input type="password" name="confirm" minlength="10" autocomplete="new-password" required></label>
              <button class="button" type="submit" id="memberSubmit">Create member</button>
            </form>
          </section>
          <section class="panel table-wrap">
            <div class="section-head padded"><div><span class="eyebrow">Access</span><h2>Members</h2></div></div>
            <div class="table-scroll">
              <table>
                <thead><tr><th>Member</th><th>Role and account access</th><th>Status</th><th></th></tr></thead>
                <tbody id="memberRows"></tbody>
              </table>
            </div>
          </section>
        </div>
        <div id="toast" class="toast" role="status" aria-live="polite"></div>
      </main>
    </div>
  </div>

  <script src="/assets/common.js"></script>
  <script src="/assets/shell.js"></script>
  <script src="/assets/team.js"></script>
</body>
</html>
